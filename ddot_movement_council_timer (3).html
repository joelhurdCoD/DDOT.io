<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DDOT Movement Council — Meeting Timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --city-green:   #004445;
    --spirit-green: #279989;
    --pale-green:   #9FD5B3;
    --accent-yellow:#FEB70D;
    --light-grey:   #F2F2F2;
    --near-black:   #18252A;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    font-family: 'Montserrat', sans-serif;
    background: var(--light-grey);
    color: var(--near-black);
    overflow: hidden;
  }

  .app {
    display: grid;
    grid-template-columns: 320px 1fr;
    grid-template-rows: 56px 1fr;
    height: 100vh;
    min-width: 1280px;
  }

  /* ── Header ── */
  .header {
    grid-column: 1 / -1;
    background: var(--city-green);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
  }
  .header-title {
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .header-subtitle {
    color: var(--pale-green);
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0.05em;
  }

  /* ── Sidebar ── */
  .sidebar {
    background: var(--city-green);
    padding: 20px 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sidebar-label {
    color: var(--pale-green);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 0 22px 12px;
    border-bottom: 1px solid rgba(159,213,179,0.15);
    margin-bottom: 8px;
  }
  .segment-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 22px;
    cursor: pointer;
    transition: background 0.2s;
    position: relative;
  }
  .segment-item:hover:not(.active):not(.running-lock) {
    background: rgba(159,213,179,0.08);
  }
  .segment-item:hover:not(.active):not(.running-lock) .seg-name {
    color: var(--pale-green);
  }
  .segment-item.running-lock {
    cursor: default;
  }
  .segment-item.active {
    background: rgba(39,153,137,0.25);
    border-left: 3px solid var(--spirit-green);
    padding-left: 19px;
  }
  .segment-item.done .seg-num,
  .segment-item.done .seg-name,
  .segment-item.done .seg-dur {
    opacity: 0.35;
  }
  .segment-item.done .seg-check { display: flex; }
  .seg-check {
    display: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--spirit-green);
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .seg-check svg { width: 9px; height: 9px; }
  .seg-num {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: rgba(159,213,179,0.12);
    color: var(--pale-green);
    font-size: 10px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .segment-item.active .seg-num {
    background: var(--spirit-green);
    color: #fff;
  }
  .seg-name {
    flex: 1;
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    line-height: 1.3;
  }
  .segment-item.active .seg-name {
    color: var(--pale-green);
  }
  .seg-dur {
    color: rgba(255,255,255,0.4);
    font-size: 11px;
    font-weight: 400;
  }

  /* ── Main ── */
  .main {
    display: flex;
    flex-direction: column;
    padding: 28px 36px 24px;
    gap: 20px;
    background: var(--light-grey);
  }

  /* Segment info row */
  .segment-info {
    display: flex;
    align-items: baseline;
    gap: 14px;
  }
  .segment-number-badge {
    background: var(--spirit-green);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    padding: 3px 10px;
    border-radius: 20px;
    text-transform: uppercase;
  }
  .segment-title-display {
    font-size: 22px;
    font-weight: 800;
    color: var(--city-green);
    letter-spacing: -0.02em;
  }

  /* Timer core */
  .timer-core {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--city-green);
    border-radius: 16px;
    padding: 36px 48px;
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
  }
  .timer-core::before {
    content: '';
    position: absolute;
    top: -60px; right: -60px;
    width: 200px; height: 200px;
    border-radius: 50%;
    background: rgba(39,153,137,0.12);
  }
  .timer-core::after {
    content: '';
    position: absolute;
    bottom: -40px; left: 20px;
    width: 120px; height: 120px;
    border-radius: 50%;
    background: rgba(159,213,179,0.07);
  }
  .countdown-display {
    font-size: 96px;
    font-weight: 800;
    color: #fff;
    letter-spacing: -0.03em;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    position: relative;
    z-index: 1;
    transition: color 0.3s;
  }
  .countdown-display.warning {
    color: var(--accent-yellow);
    animation: pulse-warn 1s ease-in-out infinite;
  }
  @keyframes pulse-warn {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
  }
  .timer-core.complete .countdown-display {
    font-size: 36px;
    letter-spacing: 0.02em;
    color: var(--pale-green);
  }

  /* Segment progress bar */
  .progress-section {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    font-weight: 600;
    color: var(--spirit-green);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .progress-bar-track {
    height: 10px;
    background: rgba(0,68,69,0.12);
    border-radius: 6px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--spirit-green);
    border-radius: 6px;
    transition: width 1s linear, background 0.3s;
  }
  .progress-bar-fill.warning {
    background: var(--accent-yellow);
  }

  /* Overall progress */
  .overall-section {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .overall-label {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    font-weight: 600;
    color: rgba(0,68,69,0.5);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .overall-bar-track {
    height: 6px;
    background: rgba(0,68,69,0.08);
    border-radius: 4px;
    overflow: hidden;
  }
  .overall-bar-fill {
    height: 100%;
    background: var(--pale-green);
    border-radius: 4px;
    transition: width 1s linear;
  }

  /* Controls */
  .controls {
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .btn {
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border: none;
    border-radius: 8px;
    padding: 13px 28px;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
  }
  .btn:active { transform: scale(0.97); }
  .btn:hover { opacity: 0.88; }
  .btn-primary {
    background: var(--spirit-green);
    color: #fff;
    min-width: 120px;
  }
  .btn-secondary {
    background: transparent;
    color: var(--city-green);
    border: 2px solid var(--city-green);
    opacity: 0.55;
  }
  .btn-secondary:hover { opacity: 1; }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: rgba(0,68,69,0.2);
    flex-shrink: 0;
  }
  .status-dot.running { background: var(--spirit-green); animation: blink 1.2s ease-in-out infinite; }
  .status-dot.paused  { background: var(--accent-yellow); }
  @keyframes blink {
    0%, 100% { opacity: 1; } 50% { opacity: 0.3; }
  }
  .status-text {
    font-size: 12px;
    font-weight: 600;
    color: var(--near-black);
    opacity: 0.5;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <header class="header">
    <div>
      <div class="header-title">DDOT Movement Council</div>
      <div class="header-subtitle">Weekly Executive Leadership Meeting — 60 Minutes</div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <div class="status-dot" id="statusDot"></div>
      <span class="status-text" id="statusText">Ready</span>
    </div>
  </header>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-label">Agenda</div>
    <div id="agendaList"></div>
  </aside>

  <!-- Main -->
  <main class="main">

    <div class="segment-info">
      <span class="segment-number-badge" id="segBadge">1 of 7</span>
      <span class="segment-title-display" id="segTitle">Cultural Reinforcement</span>
    </div>

    <div class="timer-core" id="timerCore">
      <div class="countdown-display" id="countdown">2:00</div>
    </div>

    <div class="progress-section">
      <div class="progress-label">
        <span>Segment Progress</span>
        <span id="segProgressPct">100%</span>
      </div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="segBar" style="width:100%"></div>
      </div>
    </div>

    <div class="overall-section">
      <div class="overall-label">
        <span>Meeting Progress</span>
        <span id="elapsedLabel">Elapsed: 0:00 / 60:00</span>
      </div>
      <div class="overall-bar-track">
        <div class="overall-bar-fill" id="overallBar" style="width:0%"></div>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-primary" id="btnStartPause">Start</button>
      <button class="btn btn-secondary" id="btnReset">Reset</button>
    </div>

  </main>
</div>

<script>
  // ── Agenda Data ───────────────────────────────────────────────────────────────
  const SEGMENTS = [
    { name: 'Cultural Reinforcement',  duration: 2 * 60 },
    { name: 'KPI Review',              duration: 8 * 60 },
    { name: 'Old Business',            duration: 5 * 60 },
    { name: 'Agenda Items',            duration: 30 * 60 },
    { name: 'Risk Scan',               duration: 5 * 60 },
    { name: 'Decision & Action Review',duration: 5 * 60 },
    { name: 'Contingency Time',        duration: 5 * 60 },
  ];
  const TOTAL_SECONDS = SEGMENTS.reduce((s, g) => s + g.duration, 0); // 3600

  // ── State ─────────────────────────────────────────────────────────────────────
  let segIndex = 0;
  let segRemaining = SEGMENTS[0].duration;
  let running = false;
  let complete = false;
  let intervalId = null;
  let lastTick = null;

  // ── DOM refs ──────────────────────────────────────────────────────────────────
  const elCountdown   = document.getElementById('countdown');
  const elSegBadge    = document.getElementById('segBadge');
  const elSegTitle    = document.getElementById('segTitle');
  const elSegBar      = document.getElementById('segBar');
  const elSegPct      = document.getElementById('segProgressPct');
  const elOverallBar  = document.getElementById('overallBar');
  const elElapsed     = document.getElementById('elapsedLabel');
  const elTimerCore   = document.getElementById('timerCore');
  const elStatusDot   = document.getElementById('statusDot');
  const elStatusText  = document.getElementById('statusText');
  const elBtnSP       = document.getElementById('btnStartPause');
  const elBtnReset    = document.getElementById('btnReset');
  const elAgendaList  = document.getElementById('agendaList');

  // ── Build sidebar ─────────────────────────────────────────────────────────────
  function buildSidebar() {
    elAgendaList.innerHTML = '';
    SEGMENTS.forEach((seg, i) => {
      const div = document.createElement('div');
      div.className = 'segment-item';
      div.id = `seg-item-${i}`;
      const mins = seg.duration / 60;
      div.innerHTML = `
        <span class="seg-check"><svg viewBox="0 0 10 8" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1 4L4 7L9 1" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="seg-num">${i + 1}</span>
        <span class="seg-name">${seg.name}</span>
        <span class="seg-dur">${mins} min</span>
      `;
      div.addEventListener('click', () => {
        if (running) return; // locked while running
        if (complete) {
          complete = false;
          elTimerCore.classList.remove('complete');
          elBtnSP.disabled = false;
          elBtnSP.style.opacity = '';
        }
        clearInterval(intervalId);
        intervalId = null;
        segIndex = i;
        segRemaining = SEGMENTS[i].duration;
        if ('speechSynthesis' in window) { try { window.speechSynthesis.cancel(); } catch(e){} }
        render();
      });
      elAgendaList.appendChild(div);
    });
  }

  function updateSidebar() {
    SEGMENTS.forEach((_, i) => {
      const el = document.getElementById(`seg-item-${i}`);
      el.classList.remove('active', 'done', 'running-lock');
      if (running) el.classList.add('running-lock');
      if (i < segIndex) el.classList.add('done');
      else if (i === segIndex && !complete) el.classList.add('active');
    });
  }

  // ── Format helpers ────────────────────────────────────────────────────────────
  function fmt(secs) {
    const m = Math.floor(secs / 60);
    const s = secs % 60;
    return `${m}:${String(s).padStart(2, '0')}`;
  }

  function elapsedSecs() {
    let e = 0;
    for (let i = 0; i < segIndex; i++) e += SEGMENTS[i].duration;
    e += (SEGMENTS[segIndex].duration - segRemaining);
    return e;
  }

  // ── Render ────────────────────────────────────────────────────────────────────
  function render() {
    if (complete) {
      elCountdown.textContent = 'Meeting Complete';
      elTimerCore.classList.add('complete');
      elCountdown.classList.remove('warning');
      elSegBar.style.width = '0%';
      elSegPct.textContent = '0%';
      elOverallBar.style.width = '100%';
      elElapsed.textContent = 'Elapsed: 60:00 / 60:00';
      elSegBadge.textContent = '7 of 7';
      elSegTitle.textContent = 'Meeting Complete';
      elStatusDot.className = 'status-dot';
      elStatusText.textContent = 'Done';
      elBtnSP.textContent = 'Start';
      elBtnSP.disabled = true;
      elBtnSP.style.opacity = '0.35';
      updateSidebar();
      return;
    }

    const seg = SEGMENTS[segIndex];
    const isWarning = segRemaining <= 60;
    const pct = Math.round((segRemaining / seg.duration) * 100);
    const elapsed = elapsedSecs();
    const overallPct = Math.round((elapsed / TOTAL_SECONDS) * 100);

    elCountdown.textContent = fmt(segRemaining);
    elCountdown.classList.toggle('warning', isWarning);
    elSegBar.classList.toggle('warning', isWarning);
    elSegBar.style.width = pct + '%';
    elSegPct.textContent = pct + '%';
    elOverallBar.style.width = overallPct + '%';
    elElapsed.textContent = `Elapsed: ${fmt(elapsed)} / 60:00`;
    elSegBadge.textContent = `${segIndex + 1} of ${SEGMENTS.length}`;
    elSegTitle.textContent = seg.name;

    if (running) {
      elStatusDot.className = 'status-dot running';
      elStatusText.textContent = 'Running';
      elBtnSP.textContent = 'Pause';
    } else {
      elStatusDot.className = elapsed > 0 ? 'status-dot paused' : 'status-dot';
      elStatusText.textContent = elapsed > 0 ? 'Paused' : 'Ready';
      elBtnSP.textContent = elapsed > 0 ? 'Resume' : 'Start';
    }

    updateSidebar();
  }

  // ── Speech ────────────────────────────────────────────────────────────────────
  function speak(text) {
    if (!('speechSynthesis' in window)) return;
    try {
      window.speechSynthesis.cancel();
      const utt = new SpeechSynthesisUtterance(text);
      utt.rate = 0.95;
      utt.pitch = 1;
      window.speechSynthesis.speak(utt);
    } catch (e) { /* fail silent */ }
  }

  // ── Tick ──────────────────────────────────────────────────────────────────────
  function tick() {
    const now = Date.now();
    const delta = Math.round((now - lastTick) / 1000);
    lastTick = now;
    segRemaining -= delta;

    if (segRemaining <= 0) {
      // Transition
      running = false;
      clearInterval(intervalId);
      intervalId = null;

      const isLast = segIndex === SEGMENTS.length - 1;
      if (isLast) {
        segRemaining = 0;
        complete = true;
        render();
        speak('Meeting time is complete.');
      } else {
        const fromName = SEGMENTS[segIndex].name;
        const toName   = SEGMENTS[segIndex + 1].name;
        segIndex++;
        segRemaining = SEGMENTS[segIndex].duration;
        render();
        speak(`${fromName} has ended. Moving to ${toName}.`);
        // resume after ~1s pause for speech
        setTimeout(() => {
          if (!complete) {
            running = true;
            lastTick = Date.now();
            intervalId = setInterval(tick, 1000);
            render();
          }
        }, 1000);
      }
      return;
    }

    render();
  }

  // ── Controls ──────────────────────────────────────────────────────────────────
  elBtnSP.addEventListener('click', () => {
    if (complete) return;
    if (running) {
      running = false;
      clearInterval(intervalId);
      intervalId = null;
    } else {
      running = true;
      lastTick = Date.now();
      intervalId = setInterval(tick, 1000);
    }
    render();
  });

  elBtnReset.addEventListener('click', () => {
    running = false;
    complete = false;
    clearInterval(intervalId);
    intervalId = null;
    segIndex = 0;
    segRemaining = SEGMENTS[0].duration;
    elTimerCore.classList.remove('complete');
    elBtnSP.disabled = false;
    elBtnSP.style.opacity = '';
    if ('speechSynthesis' in window) { try { window.speechSynthesis.cancel(); } catch(e){} }
    render();
  });

  // ── Init ──────────────────────────────────────────────────────────────────────
  buildSidebar();
  render();
</script>
</body>
</html>
